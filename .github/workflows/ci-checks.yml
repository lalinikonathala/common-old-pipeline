name: CI/CD Checks

on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      user:
        required: true
      token:
        required: true
      SNYK_TOKEN:
        required: true
      SNYK_ORG:
        required: false
    inputs:
      SHORTSHA:
        required: true
        type: string
      SONAR_PROJECT_ID:
        required: true
        type: string
      SONAR_PROJECT_KEY:
        required: true
        type: string
      JDK_VERSION:
        default: "17"
        required: false
        type: string

jobs:
  sonar-build:
    name: Unit Tests + Sonar Analysis
    runs-on: [de-c360-runners-dev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{inputs.JDK_VERSION}}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven

      - name: Run Unit Test
        run: |-
          export GITHUB_USER=${{env.user}}
          export GITHUB_TOKN=${{env.token}}
          export GITHUB_TOKEN=${{env.token}}
          mvn -s $GITHUB_WORKSPACE/settings.xml -U clean test -Drevision=${{inputs.SHORTSHA}}
        env:
          user: ${{ secrets.user }}
          token: ${{ secrets.token }}

      - name: Find JaCoCo XML Report
        id: find_jacoco_report
        run: |
          echo "Finding JaCoCo XML report..."
          JACOCO_REPORT=$(find target -type f -name 'jacoco.xml' -print -quit)  # Find the first jacoco.xml file
          if [ -z "$JACOCO_REPORT" ]; then
            echo "No JaCoCo XML report found! - Meaning no Code Coverage found"
            exit 1
          fi
            echo "JACOCO_REPORT=${JACOCO_REPORT}" >> $GITHUB_ENV

      - name: Run SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarqubeenterprise.pgcloud.com/sonarqube/ \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.projectKey=${{ inputs['SONAR_PROJECT_KEY'] }} \
            -Dsonar.projectId=${{ inputs['SONAR_PROJECT_ID'] }} \
            -Dsonar.login=${{ secrets.sonar_token }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ env.JACOCO_REPORT }}
